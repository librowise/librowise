<!doctype html>
<html lang="{{ lang or 'en' }}" dir="{{ dir or 'ltr' }}" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{% block meta_description %}{{ t('meta.description', library=library_name) }}{% endblock %}">
  <meta name="theme-color" content="#0c7064" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f16" media="(prefers-color-scheme: dark)">
  <title>{% block title %}{{ library_name }}{% endblock %}</title>
  {% block head_extra %}{% endblock %}
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/icon.svg">
  <link rel="preload" href="/static/fonts/inter/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/tokens.css?v={{ version }}">
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
  <link rel="stylesheet" href="/static/css/ui.css?v={{ version }}">
  <script src="/static/js/theme-boot.js?v={{ version }}"></script>
  <script type="application/json" id="boot">{{ {
    "user": ({"id": user.id, "name": user.full_name, "card": user.card_number, "role": user.role.value,
              "is_staff": user.is_staff, "preferences": user.preferences or {}, "home_branch_id": user.home_branch_id} if user else None),
    "currency": "INR", "page": page, "version": version, "path_params": path_params or {}, "biblio_id": biblio_id or None,
    "q": q or ""
  } | tojson }}</script>
  <script type="application/json" id="i18n">{{ (i18n_boot or {}) | tojson }}</script>
  <script type="module" src="/static/js/core.js"></script>
  <script type="module" src="/static/js/pwa.js"></script>
</head>
<body data-page="{{ page }}">
  <a class="skip-link" href="#main">{{ t('common.skip_to_content') }}</a>
  {% include "_icons.html" %}
  {% block body %}{% endblock %}
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
