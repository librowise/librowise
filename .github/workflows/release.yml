name: Release
# On a version tag (v1.2.3): Debian packages for each supported release and architecture,
# the Python sdist/wheel, a multi-arch image on GHCR, all attached to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/librowise/librowise

jobs:
  deb:
    name: deb (${{ matrix.codename }}, ${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:24.04", codename: noble, runner: ubuntu-24.04, packages: python3-venv, python: python3 }
          - { image: "ubuntu:24.04", codename: noble, runner: ubuntu-24.04-arm, packages: python3-venv, python: python3 }
          - { image: "ubuntu:22.04", codename: jammy, runner: ubuntu-24.04, packages: "python3.11 python3.11-venv", python: python3.11 }
          - { image: "debian:12", codename: bookworm, runner: ubuntu-24.04, packages: python3-venv, python: python3 }
          - { image: "debian:12", codename: bookworm, runner: ubuntu-24.04-arm, packages: python3-venv, python: python3 }
          - { image: "debian:13", codename: trixie, runner: ubuntu-24.04, packages: python3-venv, python: python3 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package version
        run: |
          version="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != pyproject version $version"; exit 1; }
      - name: Build
        run: |
          docker run --rm -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" -v "$PWD":/src -w /src ${{ matrix.image }} bash -c \
            "apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q ${{ matrix.packages }} git \
             && packaging/build-deb.sh --python ${{ matrix.python }} --suffix '~${{ matrix.codename }}' --out /src/dist"
      - name: Smoke test
        run: docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} packaging/smoke-test-deb.sh dist/librowise_*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.codename }}-${{ strategy.job-index }}
          path: dist/*.deb
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [deb, python, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag --title "Librowise $GITHUB_REF_NAME")
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            --notes-start-tag "" 2>/dev/null || gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
