{% extends "opac_base.html" %}
{% block title %}{{ t('login.title') }} · {{ library_name }}{% endblock %}
{% block content %}
<div class="wrap" style="max-width:440px;padding-top:3rem">
  <div class="card pad stack">
    <div>
      <h1 style="font-size:1.5rem">{{ t('login.heading') }}</h1>
      <p class="muted">{{ t('login.lead') }}</p>
    </div>
    <form id="login-form" class="stack" novalidate>
      <div class="field">
        <label for="username">{{ t('login.username') }}</label>
        <input id="username" name="username" autocomplete="username" required autofocus aria-describedby="login-error">
      </div>
      <div class="field">
        <label for="password">{{ t('login.password') }}</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="login-error">
      </div>
      <div id="login-error" class="alert bad hidden" role="alert"></div>
      <button class="btn primary lg" type="submit">{{ t('common.sign_in') }}</button>
    </form>
    <details class="small muted">
      <summary>{{ t('login.demo') }}</summary>
      <div class="stack tight" style="margin-top:.5rem">
        <button type="button" class="chip" data-demo="admin">{{ t('login.demo_admin') }}</button>
        <button type="button" class="chip" data-demo="librarian">{{ t('login.demo_librarian') }}</button>
        <button type="button" class="chip" data-demo="patron">{{ t('login.demo_patron') }}</button>
        <span class="tiny">{{ t('login.demo_note') }}</span>
      </div>
    </details>
  </div>
</div>
{% endblock %}
