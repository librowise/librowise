{% extends "opac_base.html" %}
{% block content %}
<section class="hero" aria-labelledby="hero-title">
  <div class="inner">
    <h1 id="hero-title">{{ t('opac.home.title') }}</h1>
    <p>{{ t('opac.home.lead', library=library_name) }}</p>
    <form class="searchbox" id="hero-search" action="/search" role="search" aria-label="{{ t('opac.search.label') }}">
      <svg class="icon muted" style="margin-inline-start:.6rem" aria-hidden="true"><use href="#i-search"></use></svg>
      <input name="q" id="hero-q" type="search" placeholder="{{ t('opac.home.placeholder') }}" aria-label="{{ t('opac.search.label') }}"
             data-search-focus data-suggest-input autocomplete="off" spellcheck="false">
      <input type="hidden" name="mode" id="hero-mode" value="smart">
      <div class="mode" role="group" aria-label="{{ t('opac.search.mode') }}">
        <button type="button" data-mode="smart" aria-pressed="true" title="{{ t('opac.search.mode_ai_hint') }}"><svg class="icon" aria-hidden="true"><use href="#i-sparkle"></use></svg>{{ t('opac.search.mode_ai') }}</button>
        <button type="button" data-mode="keyword" aria-pressed="false">{{ t('opac.search.mode_keyword') }}</button>
      </div>
      <button class="btn primary" type="submit">{{ t('common.search') }}</button>
    </form>
    <div class="suggest-chips" role="group" aria-label="{{ t('opac.home.examples') }}">
      <button type="button" class="chip" data-q="classic detective mysteries">{{ t('opac.home.chip_detective') }}</button>
      <button type="button" class="chip" data-q="books about space for kids">{{ t('opac.home.chip_space') }}</button>
      <button type="button" class="chip" data-q="dystopian novels published before 1960">{{ t('opac.home.chip_dystopia') }}</button>
      <button type="button" class="chip" data-q="indian fiction available now">{{ t('opac.home.chip_indian') }}</button>
      <button type="button" class="chip" data-q="learn artificial intelligence">{{ t('opac.home.chip_ai') }}</button>
    </div>
  </div>
</section>
<div class="wrap">
  <div id="shelves" aria-busy="true">
    <span class="sr-only">{{ t('common.loading') }}</span>
    {% for _ in range(2) %}<div class="shelf" aria-hidden="true"><div class="skeleton" style="height:1.4rem;width:200px"></div><div class="shelf-row" style="margin-top:1rem">{% for _ in range(6) %}<div class="skeleton" style="aspect-ratio:2/3"></div>{% endfor %}</div></div>{% endfor %}
  </div>
  <div id="public-lists"></div>
</div>
{% endblock %}
