{% extends "opac_base.html" %}
{% block content %}
<div class="wrap">
  <nav class="small muted" style="margin-bottom:1rem" aria-label="{{ t('opac.record.breadcrumb') }}"><a href="/search" id="back-link">{{ t('opac.record.back') }}</a></nav>
  <div id="record" aria-busy="true"><div class="record-layout"><div class="skeleton" style="aspect-ratio:2/3;max-width:260px"></div><div><div class="skeleton" style="height:2.2rem;width:70%"></div><div class="skeleton" style="height:1rem;width:40%;margin-top:1rem"></div><div class="skeleton" style="height:8rem;margin-top:1.5rem"></div></div></div></div>
  <section class="shelf" id="related-section" aria-labelledby="related-title" hidden>
    <div class="shelf-head"><h2 id="related-title">{{ t('opac.record.related') }}</h2><span class="badge ai"><svg class="icon" aria-hidden="true"><use href="#i-sparkle"></use></svg>{{ t('opac.record.ai_recs') }}</span></div>
    <div class="shelf-row" id="related"></div>
  </section>
</div>
{% endblock %}
