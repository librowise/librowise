# Librowise instance 'central' - Managed by `librowise instance`.
# HTTPS:  sudo apt install certbot python3-certbot-nginx && sudo certbot --nginx -d catalogue.example.org
# then set SHELFWISE_COOKIE_SECURE=true and SHELFWISE_PUBLIC_URL=https://catalogue.example.org in the instance env file and
# run `librowise instance restart central`. Files edited by certbot are never overwritten.
upstream librowise_central {
    server 127.0.0.1:8100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name catalogue.example.org;
    client_max_body_size 60m;               # MARC imports up to 50 MB
    location = /metrics { return 404; }    # scrape from the host instead
    location / {
        proxy_pass http://librowise_central;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_read_timeout 120s;             # AI requests can take a while
    }
}
