name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  postgres:
    # The full suite against PostgreSQL 17 (tsvector search, SKIP LOCKED job claiming, pg_dump backups).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: librowise
          POSTGRES_PASSWORD: librowise
          POSTGRES_DB: librowise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U librowise -d librowise_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LIBROWISE_TEST_DATABASE_URL: postgresql+psycopg://librowise:librowise@localhost:5432/librowise_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: PostgreSQL 17 client tools (pg_dump for backup tests)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev,postgres]"
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check ES modules
        run: |
          # every module, including pages/<feature>/*.js sub-folders (sw.js and theme-boot.js are classic scripts)
          find librowise/static/js -name '*.js' | while read -r f; do
            cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || { echo "::error file=$f::syntax error"; exit 1; }
          done

  ui-audit:
    # Accessibility / visual audit of every page (scripts/ui_audit.py). Informational for now: it
    # reports serious axe violations and JS errors without blocking merges; the HTML report and
    # screenshots are uploaded as an artifact.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      LIBROWISE_ENVIRONMENT: development
      LIBROWISE_DATABASE_URL: sqlite:////tmp/ui-audit.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Run the UI audit (seeds SQLite and starts the server itself)
        run: python scripts/ui_audit.py --serve --browser chromium --base-url http://127.0.0.1:8781 --concurrency 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-audit
          path: |
            var/ui-audit/index.html
            var/ui-audit/report.json
            var/ui-audit/shots/
            var/ui-audit/server.log
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t librowise:ci .
      - name: Smoke test (non-root, health endpoint, worker CLI)
        run: |
          test "$(docker run --rm librowise:ci id -u)" = "10001"
          docker run -d --name sw -e LIBROWISE_DATABASE_URL=sqlite:////home/librowise/sw.db -e LIBROWISE_SECRET_KEY=ci -p 8000:8000 librowise:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/healthz
          docker exec sw python -m librowise jobs types
          docker rm -f sw
