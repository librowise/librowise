[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfwise"
version = "1.0.0"
description = "Modern, AI-assisted integrated library system (ILS) — a Python reimagining of Koha"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Shelfwise contributors" }]
keywords = ["library", "ils", "koha", "opac", "circulation", "marc", "fastapi", "ai"]
classifiers = [
  "Framework :: FastAPI",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "pymarc>=5.2",
  "rapidfuzz>=3.9",
  "httpx>=0.27",
  "anthropic>=1.0",
  "pyjwt[crypto]>=2.8",  # OpenID Connect ID-token verification; cryptography also encrypts TOTP secrets
  "segno>=1.6",  # pure-Python QR codes for 2FA enrolment
  "tzdata>=2024.1",  # IANA zones for cron schedules on systems without /usr/share/zoneinfo (Windows, slim images)
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.6", "playwright>=1.45"]  # playwright: scripts/ui_audit.py

[project.scripts]
shelfwise = "shelfwise.__main__:main"

[tool.setuptools.packages.find]
include = ["shelfwise*"]

[tool.setuptools.package-data]
shelfwise = ["templates/**/*", "static/**/*", "migrations/*.mako", "i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E501",  # long template/HTML lines are clearer unwrapped
  "E741",  # `l` for loan in comprehensions
  "B008",  # FastAPI's Depends()/Query() in defaults is idiomatic
  "B904",
]
